name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  cpu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            data_generator/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install -r requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py train.py methods utils data_generator tests
      - name: Run unit and smoke tests
        run: python -m unittest discover -s tests -v
